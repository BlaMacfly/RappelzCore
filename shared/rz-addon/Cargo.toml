[package]
name = "rz-addon"
description = "Bounded Lua 5.1 addon runtime and renderer-independent UI for RappelzRust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
mlua = { version = "0.11.6", features = ["lua51", "vendored", "error-send"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
