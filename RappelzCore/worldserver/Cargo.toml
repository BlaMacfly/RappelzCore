[package]
name = "rappelzcore-worldserver"
description = "RappelzCore worldserver : serveur de jeu Rappelz sur les bases acore_characters / acore_world"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "worldserver"
path = "src/main.rs"

[dependencies]
rz-common = { path = "../../shared/rz-common" }
rz-database = { path = "../../shared/rz-database" }
rz-proto = { path = "../../shared/rz-proto" }
rz-rappelz = { path = "../../shared/rz-rappelz" }
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
rand.workspace = true
clap.workspace = true
chrono.workspace = true
base64 = "0.22"
roxmltree = "0.21"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
